name: Java Maven CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Bai03/pom.xml

      - name: Run Maven Build Lifecycle (Test & Package)
        run: mvn -B -f Bai03/pom.xml clean test package

      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar
          path: Bai03/target/*.jar
          retention-days: 7