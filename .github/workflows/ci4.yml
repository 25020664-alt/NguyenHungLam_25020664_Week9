name: Java Maven Multi-OS CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: Bai04/pom.xml

      - name: Run Maven Build Lifecycle (Test & Package)
        run: mvn -B -f Bai04/pom.xml clean test package

      - name: Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-bai04-${{ matrix.os }}
          path: Bai04/target/*.jar
          retention-days: 7